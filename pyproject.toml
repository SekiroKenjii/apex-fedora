[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-build-tools"
version = "0.2.0"
requires-python = ">=3.14"
description = "Isolated Fedora image builds and evidence checks"

[project.scripts]
apex = "apex.cli.main:main"
apex-agent = "apex.agent.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"apex.attestation.catalogue" = ["*.toml"]
"apex.assets.verbatim" = ["*.verbatim"]

[dependency-groups]
dev = ["pytest>=8,<10", "pycdlib>=1.14,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools", "tests/support"]
addopts = "-ra -p no:cacheprovider -m 'not integration and not benchmark'"
markers = [
    "integration: requires file-backed guest artifacts",
    "benchmark: holds a threshold of the specification's performance table",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tools"]

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "SIM", "RET", "PTH", "ARG", "C4", "TID", "ERA",
    "C90", "PLR0915",
]
# The error taxonomy is named for what the caller should do, not for the word "Error".
ignore = ["N818"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-statements = 40

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pylint.similarities]
min-similarity-lines = 10
ignore-imports = true
ignore-signatures = true
ignore-docstrings = true

[tool.importlinter]
root_packages = ["apex"]

[[tool.importlinter.contracts]]
name = "The layers import downward, and never a layer above"
type = "layers"
layers = [
    "apex.agent",
    "apex.cli",
    "apex.wiring",
    "apex.adapters",
    "apex.verification",
    "apex.composition",
    "apex.provisioning",
    "apex.attestation",
    "apex.trust",
    "apex.workspace",
    "apex.generating",
    "apex.config | apex.targeting",
    "apex.pipeline",
    "apex.registry",
    "apex.ports",
    "apex.model",
    "apex.kernel | apex.assets",
]

[tool.pyright]
include = ["src", "tools/migration", "tests/unit", "tests/contract", "tests/architecture", "tests/pipelines", "tests/property", "tests/support"]
extraPaths = ["src", "tools", "tests/support"]
typeCheckingMode = "standard"
