[project]
name = "apex-build-tools"
version = "0.1.0"
requires-python = ">=3.11"
description = "Isolated Fedora image builds and evidence checks"

[dependency-groups]
dev = ["pytest>=8,<10", "pycdlib>=1.14,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
addopts = "-ra -p no:cacheprovider"
markers = ["integration: requires file-backed guest artifacts"]
