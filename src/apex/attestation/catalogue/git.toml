[[check]]
id = "git.commit-policy"
environment = "build"
summary = "A commit message must be one Conventional Commit subject of at most 72 characters, and the commit-msg hook rejects unknown types, multi-line messages, bodies and co-author trailers."
accepted_proof_kinds = [".json", ".xml"]
scope_limits = [
    "No push to any external remote is made: the questions are asked of repositories made for the purpose under the runtime root, and the proof records each question with the hook's answer.",
    "CONTRIBUTING.md: hooks are local safety checks, not server-side access control; the check establishes local hook behaviour, not enforcement on a remote.",
    "The repositories carry a fixture identity and none of the operator's configuration, so a global hook path or signing setting cannot answer for the rules.",
]
sourced_from = "src/apex/workspace/hookproving.py, MESSAGES: the seven messages the commit-msg hook is asked, and the rule each must name."

[[check]]
id = "git.outgoing-history"
environment = "build"
summary = "Every commit a push would send has its subject and its full tree re-checked, so a private file deleted in a later commit, a commit body or a co-author trailer anywhere in outgoing history is still refused before the push."
accepted_proof_kinds = [".json", ".xml"]
scope_limits = [
    "No push to any external remote is made: the pre-push hook is asked about the updates it would judge, over a repository made for the purpose, and the proof records each answer.",
    "The push path is asked four ways: the commits a push would send, a branch created from the clean base, a branch deleted, and a remote commit never fetched, which is refused rather than treated as empty.",
    "A private file is caught in the commit that added it although a later commit removed it, because every outgoing commit's whole tree is judged.",
]
sourced_from = "src/apex/workspace/hookproving.py, outgoing_history: the history built and the four updates asked."

[[check]]
id = "git.private-stage"
environment = "build"
summary = "Staged content, not the working tree, is inspected before a commit is created, so private or local-only paths, renamed local-only documents, symlinks, submodules, opaque binaries and secret material are refused before a commit exists."
accepted_proof_kinds = [".json", ".xml"]
scope_limits = [
    "No push to any external remote is made; the pre-commit hook is asked about what is staged in a repository made for the purpose.",
    "The check establishes what the index refuses: a private document, a private key, a local-only marker under another name, an opaque binary, a symlink entry and a submodule entry; a clean file is permitted.",
    "CONTRIBUTING.md: hooks are local safety checks, not server-side access control, and must not be bypassed.",
]
sourced_from = "src/apex/workspace/hookproving.py, STAGED and private_stage: the seven entries the pre-commit hook is asked about."
