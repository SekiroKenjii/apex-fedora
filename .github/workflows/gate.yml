name: Gate

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

# A superseded run proves nothing about the commit that replaced it.
concurrency:
  group: gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      APEX_PYTHON: '3.14.4'
    steps:
      - name: Check out the whole history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # The repository rules are proved against every path this history has ever held, so
          # a shallow clone would quietly shrink the corpus that proof rests on.
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.11.28'

      - name: Install just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
        with:
          just-version: '1.45.0'

      - name: Install the host facilities the tests read
        run: |
          sudo apt-get update
          # qemu-utils backs the disk tests; ovmf provides the UEFI firmware whose presence
          # the machine command validates before it will build an argument list.
          sudo apt-get install --yes --no-install-recommends qemu-utils ovmf
          test -f /usr/share/OVMF/OVMF_CODE_4M.fd

      - name: Report the interpreter in use
        run: |
          uv run --no-project --python "${APEX_PYTHON}" python --version

      - name: Run the gate
        run: just gate
